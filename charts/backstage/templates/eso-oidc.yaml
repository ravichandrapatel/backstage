{{- if .Values.externalSecrets.enabled }}
# FILE_NAME: eso-oidc.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.oidc.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.oidc.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        AUTH_OIDC_CLIENT_ID: "{{ `{{ .clientID }}` }}"
        AUTH_OIDC_CLIENT_SECRET: "{{ `{{ .clientSecret }}` }}"
  data:
    - secretKey: clientID
      remoteRef:
        key: {{ .Values.externalSecrets.oidc.remoteKey | quote }}
        property: clientID
    - secretKey: clientSecret
      remoteRef:
        key: {{ .Values.externalSecrets.oidc.remoteKey | quote }}
        property: clientSecret
{{- end }}
