{{- if .Values.frontend.enabled }}
# FILE_NAME: frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backstage.frontendName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
    backstage.io/kubernetes-id: {{ include "backstage.frontendName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  # Keep selector stable to adopt pre-Helm Deployments (selector is immutable)
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "backstage.frontendName" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "backstage.frontendName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: {{ .Values.partOf | quote }}
        app.kubernetes.io/component: frontend
        backstage.io/kubernetes-id: {{ include "backstage.frontendName" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          env:
            - name: APP_CONFIG_app_baseUrl
              value: {{ .Values.app.baseUrl | quote }}
            - name: APP_CONFIG_backend_baseUrl
              value: {{ .Values.app.baseUrl | quote }}
            - name: APP_CONFIG_auth_environment
              value: {{ .Values.app.authEnvironment | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backstage.frontendName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: {{ include "backstage.frontendName" . }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
{{- end }}
