server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html carries runtime-injected config — never long-cache it
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  # Runtime inject mutates module-backstage.js without renaming the hash —
  # never long-cache /static or browsers keep a broken/stale bundle.
  location /static/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
